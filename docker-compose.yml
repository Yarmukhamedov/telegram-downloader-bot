version: '3.8'

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    command:
      - --api-id=${TELEGRAM_API_ID:-38969193}
      - --api-hash=${TELEGRAM_API_HASH:-553d816eeb61041699cf50948c04e3c5}
      - --local
      - --http-port=8081
      - --dir=/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

  bot:
    build: .
    container_name: telegram-downloader-bot
    restart: unless-stopped
    depends_on:
      - telegram-bot-api
    env_file:
      - .env
    environment:
      - BOT_API_SERVER=http://telegram-bot-api:8081
    volumes:
      - ./downloads:/app/downloads

volumes:
  telegram-bot-api-data:
