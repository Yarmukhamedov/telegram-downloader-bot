version: '3.8'

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID:-123456}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH:-abcdef1234567890}"
      TELEGRAM_LOCAL: "true"
    ports:
      - "8081:8081"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

  bot:
    build: .
    container_name: telegram-downloader-bot
    restart: unless-stopped
    depends_on:
      - telegram-bot-api
    env_file:
      - .env
    environment:
      - BOT_API_SERVER=http://telegram-bot-api:8081
    volumes:
      - ./downloads:/app/downloads

volumes:
  telegram-bot-api-data:
