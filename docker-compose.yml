version: '3.8'

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    network_mode: "host"
    command: telegram-bot-api --api-id=38969193 --api-hash=553d816eeb61041699cf50948c04e3c5 --local --http-port=8081 --dir=/var/lib/telegram-bot-api
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

  bot:
    build: .
    container_name: telegram-downloader-bot
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      - telegram-bot-api
    env_file:
      - .env
    environment:
      - BOT_API_SERVER=http://127.0.0.1:8081
    volumes:
      - ./downloads:/app/downloads

volumes:
  telegram-bot-api-data:
